<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tarjeta de vocabulario</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>


  <main class="pantalla">
    <button class="btn-volver" type="button" aria-label="Volver">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 5l-7 7 7 7" />
      </svg>
    </button>

    <article class="tarjeta">
      <!-- Ilustración -->
      <div class="tarjeta__imagen">
        <svg viewBox="0 0 160 130" role="img" aria-label="Gráfica que sube">
          <rect x="34" y="30" width="92" height="64" rx="4" fill="#d9eaf9" />
          <line x1="80" y1="30" x2="80" y2="94" stroke="#fff" stroke-width="3" />
          <polyline points="50,78 66,60 92,70 118,40" fill="none" stroke="#2fb5a8" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round" />
          <polygon points="108,34 124,34 124,50" fill="#2fb5a8" />
          <circle cx="66" cy="60" r="7" fill="#f0576a" />
          <circle cx="92" cy="70" r="7" fill="#5b4fb0" />
          <circle cx="50" cy="80" r="7" fill="#f4c93a" />
          <path d="M18 96h124l-12 22H30z" fill="#6a5fb5" />
        </svg>
      </div>

      <div id="resultado-guardado" hidden>
        <p>Dirección para tu etiqueta NFC:</p>
        <input type="text" id="url-tarjeta" readonly>
        <button type="button" id="copiar">Copiar</button>
        <a id="abrir-tarjeta" href="#" target="_blank">Abrir tarjeta</a>
      </div>


      <!-- Palabra en español -->
      <p class="tarjeta__espanol">
        <input type="text" id="palabra" placeholder="Escribe una palabra en español">
      </p>
      <button id="buscar" type="button">Buscar</button>
      <p id="mensaje"></p>

      <!-- Traducción -->
      <h1 class="tarjeta__ingles">
        <span id="traduccion"></span>
        <button type="button" class="btn-editar" data-objetivo="traduccion">Editar</button>
      </h1>

      <hr class="tarjeta__linea">

      <!-- Definición -->
      <div class="tarjeta__ejemplo">
        Definición: <span id="definicion"></span>
        <button type="button" class="btn-editar" data-objetivo="definicion">Editar</button>
      </div>

      <button type="button" id="guardar">Guardar</button>
      <p id="mensaje"></p>
    </article>

    <h2 class="tarjeta__titulo-reverso">Ejemplos</h2>

    <div class="ejemplos-adicionales">
      <button type="button" id="agregar-ejemplo" class="btn-agregar-ejemplo" aria-label="Agregar ejemplo">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
    </div>

    <ul class="mas-ejemplos" id="lista-ejemplos-adicionales"></ul>
  </main>

  <script src="app.js"></script>
</body>

</html>
