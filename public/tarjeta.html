<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tarjeta de vocabulario</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  
  <main class="pantalla">
    <button class="btn-volver" type="button" aria-label="Volver">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 5l-7 7 7 7" />
      </svg>
    </button>

    <input type="checkbox" id="voltear-tarjeta" class="volteo__check" aria-label="Voltear la tarjeta">
    <div class="volteo">

    <article class="tarjeta">
      <label for="voltear-tarjeta" class="btn-ejemplos">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 12H5M11 6l-6 6 6 6" />
        </svg>
        Ejemplos
      </label>

      <!-- Ilustración -->
      <div class="tarjeta__imagen">
        <button class="btn-audio" type="button" data-texto="to improve" data-idioma="en"
          aria-label="Escuchar: to improve" id="bocina"></button>
      </div>

      <!-- Palabra en español -->
      <p class="tarjeta__espanol"><span id="palabra"></span></p>

      <!-- Palabra en inglés + audio -->
      <h1 class="tarjeta__ingles">
        <span id="traduccion"></span>
      </h1>
    

      <hr class="tarjeta__linea">

      <!-- Ejemplo práctico + audio -->
      <div class="tarjeta__ejemplo">
        <div>Definición: <span id="definicion"></span></div>
      </div>  
      <p id="mensaje"></p>
    </article>

    <article class="tarjeta tarjeta--reverso">
      <label for="voltear-tarjeta" class="btn-ejemplos">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
        Volver
      </label>

      <h2 class="tarjeta__titulo-reverso">Ejemplos</h2>

      <ul class="mas-ejemplos">
        <li>
          <button class="btn-audio btn-audio--ejemplo" type="button" aria-label="Escuchar el primer ejemplo"></button>
          <div class="ejemplo__textos">
            <span id="ejemplo-1">cat is big</span>
            <span class="ejemplo__traduccion" id="traduccion-ejemplo-1">Aquí aparecerá la traducción del primer ejemplo.</span>
          </div>
        </li>
        <li>
          <button class="btn-audio btn-audio--ejemplo" type="button" aria-label="Escuchar el segundo ejemplo"></button>
          <div class="ejemplo__textos">
            <span id="ejemplo-2">dog .</span>
            <span class="ejemplo__traduccion" id="traduccion-ejemplo-2">Aquí aparecerá la traducción del segundo ejemplo.</span>
          </div>
        </li>
        <li>
          <button class="btn-audio btn-audio--ejemplo" type="button" aria-label="Escuchar el tercer ejemplo"></button>
          <div class="ejemplo__textos">
            <span id="ejemplo-3">bird flies high</span>
            <span class="ejemplo__traduccion" id="traduccion-ejemplo-3">Aquí aparecerá la traducción del tercer ejemplo.</span>
          </div>
        </li>
      </ul>
    </article>
    </div>
  </main>

  <script src="tarjeta.js"></script>
</body>

</html>
